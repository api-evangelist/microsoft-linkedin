description: >-
  First-party LinkedIn API client libraries. LinkedIn publishes exactly two official clients — a
  JavaScript/TypeScript client on npm and a Python client on PyPI — both maintained in the
  linkedin-developers GitHub org. Both are thin Rest.li protocol wrappers; neither models any
  specific LinkedIn API. Registry metadata was read live on 2026-08-13.
summary:
  official: 2
  community: 0
  languages:
    - javascript
    - python
  currency_note: >-
    Both official clients last published in 2023 (npm 0.3.0 on 2023-02-07, PyPI 0.3.0 on
    2023-06-29) while the Marketing API has shipped a new monthly version every month since —
    202607 is current as of this pass. The first-party SDKs are roughly three years behind the
    API they wrap. Because they are protocol-level wrappers rather than generated clients this
    does not break them outright, but no official client tracks current API versions.
