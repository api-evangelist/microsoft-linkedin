description: >-
  LinkedIn publishes no plans and no pricing for its APIs. This artifact replaces an earlier scaffold
  that invented Free/Pro/Enterprise tiers with quotas; none of those exist. Access to the LinkedIn
  developer platform is free to register, but every API of consequence is gated behind a product
  request and, for the Marketing, Talent, Sales and Learning surfaces, behind a commercial partner
  relationship. What a partner pays is negotiated privately and is not published anywhere on
  developer.linkedin.com or Microsoft Learn.
plan_count: 0
plans: []
pricing_published: false
pricing_url: null
access_model:
  registration: free self-serve at https://www.linkedin.com/developers/apps
  gating: per-product request and approval
  self_serve_products:
    - Sign In with LinkedIn using OpenID Connect
    - Share on LinkedIn
  partner_gated_products:
    - Marketing (Advertising, Community Management, Lead Sync, Conversions, Reporting)
    - Talent Solutions (Job Posting, Recruiter System Connect, Apply Connect, Talent Hub)
    - Sales (Sales Navigator Display / Data Integrations)
    - Learning
  note: >-
    LinkedIn's product catalog lists seven product families — Consumer, Marketing Tools, Sales,
    Talent, Learning, Plugins and Regulatory Developer Products — with no price attached to any of
    them. Marketing and Talent access requires acceptance into the corresponding partner program;
    the underlying commercial terms travel with a LinkedIn advertising or Talent Solutions contract
    rather than with the API itself.
monetization:
  metered_api_billing: false
  note: >-
    The APIs are not separately metered or billed. Cost is incurred through the underlying LinkedIn
    product (ad spend, Recruiter/Talent seats, Learning licences); the API is an access channel to a
    product the customer already buys, which is why there is no API price list to record.
