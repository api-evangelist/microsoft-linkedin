aid: microsoft-linkedin
name: Microsoft LinkedIn
description: >-
  LinkedIn, owned by Microsoft, operates a versioned Rest.li API platform covering advertising and
  marketing, company page and community management, talent and recruiting, sales navigation,
  learning, and consumer sign-in. The versioned Marketing surface lives under
  https://api.linkedin.com/rest/ and requires a Linkedin-Version YYYYMM header on every call, with
  each monthly version supported for a minimum of twelve months before it is sunset. Authentication
  is OAuth 2.0, and Sign In with LinkedIn is a conformant OpenID Connect provider with a live
  discovery document. Access to the Marketing, Talent, Sales and Learning APIs is gated behind
  product approval and, in most cases, a commercial partner relationship; LinkedIn publishes no API
  pricing and no OpenAPI definitions of its own.
