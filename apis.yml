apis:
- aid: microsoft-linkedin:marketing-api
  name: LinkedIn Marketing API
  tags:
  - Advertising
  - Marketing
  - Social Media
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://api.linkedin.com/v2/
  humanURL: https://learn.microsoft.com/en-us/linkedin/marketing/
  properties:
  - url: https://learn.microsoft.com/en-us/linkedin/marketing/
    type: Documentation
  description: >-
    The LinkedIn Marketing API enables programmatic management of LinkedIn advertising campaigns, audience
    targeting, creative assets, and performance reporting. Developers can create sponsored content, manage
    campaign groups, configure conversion tracking, and retrieve analytics data for marketing optimization.
- aid: microsoft-linkedin:consumer-api
  name: LinkedIn Consumer API
  tags:
  - Profiles
  - Sharing
  - Social Network
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://api.linkedin.com/v2/
  humanURL: https://learn.microsoft.com/en-us/linkedin/consumer/
  properties:
  - url: https://learn.microsoft.com/en-us/linkedin/consumer/
    type: Documentation
  description: >-
    The LinkedIn Consumer API provides access to member profiles, sign-in with LinkedIn, and content sharing
    capabilities. Developers can implement social sign-on, retrieve basic profile information, and enable
    users to share content to their LinkedIn feeds from external applications.
- aid: microsoft-linkedin:talent-solutions-api
  name: LinkedIn Talent Solutions API
  tags:
