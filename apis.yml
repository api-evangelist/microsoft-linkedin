  properties:
  - url: https://learn.microsoft.com/en-us/linkedin/talent/
    type: Documentation
  description: >-
    The LinkedIn Talent Solutions API provides access to recruiting and talent management capabilities.
    It enables integration with applicant tracking systems, job posting management, candidate search,
    and recruiter workflow automation for enterprise hiring processes.
