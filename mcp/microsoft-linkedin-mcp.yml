agent_notes:
  - >-
    Any real server must inject Linkedin-Version (YYYYMM) and X-Restli-Protocol-Version: 2.0.0 on
    every call; LinkedIn applies no default version and a sunset version fails with 426.
  - >-
    There is no idempotency key. A retried create_* tool call creates a duplicate entity, so a
    server must dedupe client-side.
  - >-
    No rate-limit headers are returned. A server cannot expose remaining quota to the model; on 429
    it must back off blind.
  - >-
    Writes should be scoped to a test ad account (AdAccount.test = true) during development —
    entities under it never serve and never bill.
